[project]
name = "nixconvoy"
version = "0.1.0"
description = "Clobber-safe NixOS deploys for targets shared by several checkouts"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
nixconvoy = "nixconvoy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
