[project]
name = "nixconvoy"
# A release: land this at X.Y.Z, then from a nixconvoy worktree
#   git fetch origin && git tag vX.Y.Z origin/main && git push origin vX.Y.Z
# .github/workflows/release.yml refuses a tag that is not v + this version
# on main, then builds each system, caches it and publishes the Release.
# Once that run has passed, move the branch the README installs from:
#   git push origin vX.Y.Z~0:refs/heads/release
# A dry run before tagging: gh workflow run release.yml --ref main
version = "0.2.2"
description = "Clobber-safe NixOS deploys for targets shared by several checkouts"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
nixconvoy = "nixconvoy.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
