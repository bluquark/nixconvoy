# A release: once a commit setting pyproject.toml's version to X.Y.Z is on
# main, tag it and push the tag:
#   git tag vX.Y.Z <commit> && git push origin vX.Y.Z
# Each system's package (on Linux the target's crate too, the boot-assessment
# module's) is built on a runner of its own kind, its closure pushed to
# nixconvoy.cachix.org and pinned there (a pin is exempt from the cache's
# eviction); the GitHub Release follows once every system is in.
#
# Run by hand on a pushed branch (`gh workflow run release.yml --ref
# <branch>`) it builds and pushes the same and stops there: whether a commit
# builds on every system, learnt before it is tagged.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is pyproject.toml's version, on main
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml's version is $version"
            exit 1
          fi
          # A work branch's commit is rewritten by its landing.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux, runner: ubuntu-24.04, packages: default switch-guard-target }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm, packages: default switch-guard-target }
          - { system: aarch64-darwin, runner: macos-latest, packages: default }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build
        run: |
          for p in ${{ matrix.packages }}; do
            nix build --accept-flake-config --print-build-logs --out-link "result-$p" ".#packages.${{ matrix.system }}.$p"
          done
          ./result-default/bin/nixconvoy --help > /dev/null
      - name: Push to cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PIN: ${{ github.ref_type == 'tag' && format('{0}-{1}', github.ref_name, matrix.system) || '' }}
        run: |
          cachix() { nix run --inputs-from . nixpkgs#cachix -- "$@"; }
          for p in ${{ matrix.packages }}; do
            out=$(readlink -f "result-$p")
            cachix push nixconvoy "$out"
            pin=$PIN
            [ "$p" = default ] || pin=$PIN-$p
            [ -z "$PIN" ] || cachix pin nixconvoy "$pin" "$out"
          done

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun finds its Release made.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then exit 0; fi
          # Since the latest Release: a tag the check refused has none.
          if prev=$(gh release view --json tagName --jq .tagName 2> /dev/null); then
            git log --format="- %s" "$prev..HEAD"
          else
            echo "First release."
          fi > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
